# see https://github.com/Xinyuan-LilyGO/LilyGo-T-Relay/issues/24

esphome:
  name: ${device_name}                       # device name with hyphens "window-motor-bedroom-1-back-left"
  friendly_name: ${friendly_name}            # device name "Window Motor Bedroom 1 Back Left"
  comment: 'Template Window Motor Control'        
  project:
    name: "window-motor.esphome"
    version: "2025.6.9"
  name_add_mac_suffix: false
  on_boot:
    - priority: -100  
      then:
        - switch.turn_off: output_open 
        - switch.turn_off: output_close
        - logger.log: "on_boot -100 (very early)"
    - priority: 800
      then:
        - logger.log: "on_boot 800 (before main loop)"
        - if:
            condition:
              binary_sensor.is_on: window_closed
            then:
              - logger.log: "setting initial position 0"
              - number.set:
                  id: current_position
                  value: 0
              - number.set:
                  id: target_position
                  value: 0
            else:
              - logger.log: "setting initial position 100"
              - number.set:
                  id: current_position
                  value: 100
              - number.set:
                  id: target_position
                  value: 100
        - text_sensor.template.publish:
            id: position_state
            state: "STOPPED"
        - logger.log: "finished on_boot"

esp32:
  board: esp32dev


# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  # encryption:
  #   key: "ern4m6cwTRnAZhRrbPQ3Nyalw7y08qj5jj1psS80ZrE="

ota:
  - platform: esphome
    password: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password


  # Enable fallback hotspot (captive portal) in case wifi connection fails
  #ap:
  #  ssid: "relayssid"
  #  password: "nq2RjGEY8OTf"

web_server:
  port: 80
  include_internal: true

captive_portal:
  
switch:
  - platform: gpio
    pin: 
      number: GPIO16
      # mode: INPUT_PULLUP # Use pull-up to avoid floating state
      inverted: true
    id: output_open
    name: "${friendly_name} Open Relay"
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: 
      number: GPIO17
      # mode: INPUT_PULLUP # Use pull-up to avoid floating state
      inverted: true
    id: output_close
    name: "${friendly_name} Close Relay"
    restore_mode: ALWAYS_OFF

text_sensor:
  - platform: template
    name: "${friendly_name} Position State"
    id: position_state
    update_interval: never

number:
  - platform: template
    name: "${friendly_name} Current Position"
    id: current_position
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
  - platform: template
    name: "${friendly_name} Target Position"
    id: target_position
    optimistic: true
    min_value: 0
    max_value: 100
    step: 100
    on_value:
      then:
        - logger.log: "on_value called"
        - lambda: |-
            ESP_LOGI("window", "target=%f, current=%f, closed=%s",
                    id(target_position).state,
                    id(current_position).state,
                    id(window_closed).state ? "true" : "false");
        - if:
            condition:
              lambda: 'return id(target_position).state != 200;'
            then:
              - if:
                  condition:
                    lambda: 'return id(target_position).state == 0;'
                  then:
                    - logger.log: "target_position == 0"
                    - if:
                        condition:
                          binary_sensor.is_off: window_closed
                        then:
                          - logger.log: "Moving to 0%"
                          - text_sensor.template.publish:
                              id: position_state
                              state: "DECREASING"
                          - switch.turn_on: output_close
                          - delay: 5s
                          - switch.turn_off: output_close
                          - delay: ${operation_duration}
                    - number.set:
                        id: current_position
                        value: 0
              - if:
                  condition:
                    lambda: 'return id(target_position).state != 0;'
                  then:
                    - logger.log: "target position != 0"
                    - if:
                        condition:
                          binary_sensor.is_on: window_closed
                        then:
                          - logger.log: "Moving to 100%"
                          - text_sensor.template.publish:
                              id: position_state
                              state: "INCREASING"
                          - switch.turn_on: output_open
                          - delay: 5s
                          - switch.turn_off: output_open
                          - delay: ${operation_duration}
                    - number.set:
                        id: current_position
                        value: 100
              # - script.execute: read_position
        - text_sensor.template.publish:
            id: position_state
            state: "STOPPED"      


binary_sensor:
  - platform: gpio
    pin:
      number: GPIO25
      inverted: True
      mode: INPUT_PULLUP
    id: window_closed
    name: "${friendly_name} Closed"

button:
  - platform: template
    name: "${friendly_name} Close Window"
    id: close_window
    on_press:
      then:
        - number.set:
            id: target_position
            value: 0
  - platform: template
    name: "${friendly_name} Open Window"
    id: open_window
    on_press:
      then:
        - number.set:
            id: target_position
            value: 100

light:
  - platform: binary
    name: "${friendly_name} Led"
    output: led_output

output:
  - platform: gpio
    pin: GPIO23
    id: led_output
