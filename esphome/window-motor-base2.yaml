# see https://github.com/Xinyuan-LilyGO/LilyGo-T-Relay/issues/24

esphome:
  name: ${device_name}                       # device name with hyphens "window-motor-bedroom-1-back-left"
  friendly_name: ${friendly_name}            # device name "Window Motor Bedroom 1 Back Left"
  comment: 'Template Window Motor Control'        
  project:
    name: "window-motor.esphome"
    version: "2025.6.21"
  name_add_mac_suffix: false
  on_boot:
    - priority: -100  
      then:
        - switch.turn_off: open_relay 
        - switch.turn_off: close_relay
        - logger.log: "on_boot -100 (very early)"
    - priority: 800
      then:
        - logger.log: "on_boot 800 (before main loop)"
        - if:
            condition:
              binary_sensor.is_on: window_closed
            then:
              - logger.log: "setting initial position 0"
            else:
              - logger.log: "setting initial position 100"
        - logger.log: "finished on_boot"

esp32:
  board: esp32dev


# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  # encryption:
  #   key: "ern4m6cwTRnAZhRrbPQ3Nyalw7y08qj5jj1psS80ZrE="

ota:
  - platform: esphome
    password: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password


  # Enable fallback hotspot (captive portal) in case wifi connection fails
  #ap:
  #  ssid: "relayssid"
  #  password: "nq2RjGEY8OTf"

web_server:
  port: 80
  include_internal: true

captive_portal:

# Globals for state
#globals:
#  - id: current_position
#    type: float
#    restore_value: no
#    initial_value: '0.0'
#  - id: current_op
#    type: esphome::cover::CoverOperation
#    restore_value: no
#    initial_value: 'esphome::cover::COVER_OPERATION_IDLE'
  
switch:
  - platform: gpio
    pin: 
      number: GPIO16
      # mode: INPUT_PULLUP # Use pull-up to avoid floating state
      inverted: true
    id: open_relay
    name: "Open Relay"
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: 
      number: GPIO17
      # mode: INPUT_PULLUP # Use pull-up to avoid floating state
      inverted: true
    id: close_relay
    name: "Close Relay"
    restore_mode: ALWAYS_OFF
  - platform: template
    name: "Virtual Window Sensor"
    id: "virtual_window_sensor"
    optimistic: true
  - platform: template
    name: "Have Sensor"
    id: "have_sensor"
    optimistic: true
    restore_mode: ALWAYS_ON

number:
  - platform: template
    id: open_duration
    name: "Open Duration"
    min_value: 1
    max_value: 300
    step: 1
    initial_value: 10
    optimistic: true
  - platform: template
    id: operation_duration
    name: "Relay Duration"
    min_value: 1
    max_value: 30
    step: 1
    initial_value: 3
    optimistic: true

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO25
      inverted: True
      mode: INPUT_PULLUP
    id: window_closed
    name: "Window Closed"
    filters:
     - delayed_on: 100ms
     - delayed_off: 100ms

light:
  - platform: binary
    name: "Relay Led"
    output: led_output
    id: relay_led
    internal: false

output:
  - platform: gpio
    pin: GPIO23
    id: led_output

# todo: don't want to publish so often
# also, might want to re-factor so setting position sets operation to IDLE
# would still need to set OPENING and CLOSING
# but maybe script does it.
# easier to know after adding sensor functions
script:
  - id: set_current_operation
    parameters:
      value: esphome::cover::CoverOperation
    then:
      - lambda: |-
          id(window_cover).current_operation = value;
          id(window_cover).publish_state();
  - id: set_current_position
    parameters:
      value: int
    then:
      - lambda: |-
          id(window_cover).position = value;
          id(window_cover).publish_state();    


cover:
  - platform: template
    device_class: window
    name: "Window Cover"
    id: window_cover
    internal: false
    
    has_position: true
    assumed_state: false
    optimistic: false
    
    open_action:
      - logger.log: "Opening Window a"
      - script.execute:
          id: set_current_operation
          value: esphome::cover::COVER_OPERATION_OPENING
      - switch.turn_on: open_relay
      - delay: ${command_duration}
      - switch.turn_off: open_relay
      - delay: ${operation_duration}    
      - script.execute:
          id: set_current_position
          value: esphome::cover::COVER_OPEN
      - script.execute:
          id: set_current_operation
          value: esphome::cover::COVER_OPERATION_IDLE

    close_action:
      - logger.log: "Closing Window a"
      - script.execute:
          id: set_current_operation
          value: esphome::cover::COVER_OPERATION_CLOSING
      - switch.turn_on: close_relay
      - delay: ${command_duration}
      - switch.turn_off: close_relay
      - delay: ${operation_duration}
      - script.execute:
          id: set_current_position
          value: esphome::cover::COVER_CLOSED
      - script.execute:
          id: set_current_operation
          value: esphome::cover::COVER_OPERATION_IDLE

