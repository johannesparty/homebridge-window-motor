# see https://github.com/Xinyuan-LilyGO/LilyGo-T-Relay/issues/24

esphome:
  name: ${device_name}                       # device name with hyphens "window-motor-bedroom-1-back-left"
  friendly_name: ${friendly_name}            # device name "Window Motor Bedroom 1 Back Left"
  comment: 'Template Window Motor Control'        
  project:
    name: "window-motor.esphome"
    version: "2025.7.27"
  name_add_mac_suffix: false
  on_boot:
    - priority: -100  
      then:
        - switch.turn_off: open_relay 
        - switch.turn_off: close_relay
        - logger.log: "on_boot -100 (very early)"
    - priority: 800
      then:
        - logger.log: "on_boot 800 (before main loop)"
        - script.execute: check_window_sensor 

esp32:
  board: esp32dev


# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  # encryption:
  #   key: "ern4m6cwTRnAZhRrbPQ3Nyalw7y08qj5jj1psS80ZrE="

ota:
  - platform: esphome
    password: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password


  # Enable fallback hotspot (captive portal) in case wifi connection fails
  #ap:
  #  ssid: "relayssid"
  #  password: "nq2RjGEY8OTf"

web_server:
  port: 80
  include_internal: true

captive_portal:

select:
  - platform: template
    name: "Sensor Type"
    id: sensor_type
    optimistic: true
    restore_value: true
    options:
      - "virtual"
      - "gpio"
      - "none"
    initial_option: "none"
  
switch:
  - platform: gpio
    pin: 
      number: GPIO16
      # mode: INPUT_PULLUP # Use pull-up to avoid floating state
      inverted: false
    id: open_relay
    name: "Open Relay"
    restore_mode: ALWAYS_OFF

  - platform: gpio
    pin: 
      number: GPIO17
      # mode: INPUT_PULLUP # Use pull-up to avoid floating state
      inverted: false
    id: close_relay
    name: "Close Relay"
    restore_mode: ALWAYS_OFF
  - platform: template

    name: "Virtual Window Sensor"
    id: "virtual_window_sensor"
    optimistic: true
    turn_on_action:
      - logger.log: "virtual window switch turn_on"
      - switch.template.publish:
          id: virtual_window_sensor
          state: ON      

    turn_off_action:
      - logger.log: "Window sensor switch turn_off"
      - switch.template.publish:
          id: virtual_window_sensor
          state: OFF

number:
  - platform: template
    id: open_duration
    name: "Open Duration"
    min_value: 1
    max_value: 300
    step: 1
    initial_value: ${operation_duration}
    unit_of_measurement: 's'
    optimistic: true
    restore_value: true

  - platform: template
    id: operation_duration
    name: "Relay Duration"
    min_value: 1
    max_value: 60
    step: 1
    initial_value: ${command_duration}
    unit_of_measurement: 's'    
    optimistic: true
    restore_value: true

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO25
      inverted: True
      mode: INPUT_PULLUP
    id: window_closed
    name: "Window Closed"
    filters:
     - delayed_on: 100ms
     - delayed_off: 100ms
    on_state:
      - logger.log: "Window sensor state changed"

  - platform: template
    name: "Combined Window Sensor"
    id: combined_window_sensor
    lambda: |-
        if (id(sensor_type).state == "gpio") {
          return id(window_closed).state;
        } else if (id(sensor_type).state == "virtual") {
          return id(virtual_window_sensor).state;
        } else {
          return false; // or true, depending on your logic
        }
    on_state:
      - script.execute: check_window_sensor

light:
  - platform: binary
    name: "Relay Led"
    output: led_output
    id: relay_led
    internal: false

output:
  - platform: gpio
    pin: GPIO23
    id: led_output

script:
  - id: set_current_operation
    parameters:
      value: esphome::cover::CoverOperation
    then:
      - lambda: |-
          auto start = millis();
          id(window_cover).current_operation = value;
          id(window_cover).publish_state();
          auto end = millis();
          ESP_LOGD("main", "set_current_operation took %d ms", end - start);          

  - id: set_position
    parameters:
      value: int
    then:
      - lambda: |-
          auto start = millis();
          id(window_cover).position = value;
          id(window_cover).publish_state();    
                    auto end = millis();
          ESP_LOGD("main", "set_position took %d ms", end - start);     

  - id: check_window_sensor
    then:
      - if:
          condition:
            lambda: |-
              return
                id(sensor_type).state != "none" && 
                id(window_cover).current_operation ==  COVER_OPERATION_IDLE;
          then:
            - logger.log: "Checking window sensor"
            - if:
                condition:
                  - binary_sensor.is_on: combined_window_sensor
                then:
                  - if:
                      condition:                   
                        lambda: 'return id(window_cover).position != esphome::cover::COVER_CLOSED;'
                      then:
                        - logger.log: "-> Window is closed, setting position to COVER_CLOSED"
                        - script.execute:
                            id: set_position
                            value: esphome::cover::COVER_CLOSED
                else:
                  - if:
                      condition:
                        lambda: 'return id(window_cover).position != esphome::cover::COVER_OPEN;'
                      then:
                        - logger.log: "-> Window is open, setting position to COVER_OPEN"
                        - script.execute:
                            id: set_position
                            value: esphome::cover::COVER_OPEN
          else:
            - logger.log: "skipping window sensor check"         

  # important these are in script because esphome will yield during delay in script, but not otherwise.
  - id: open_window_script
    then:
      - light.turn_on: relay_led
      - script.execute:
          id: set_current_operation
          value: esphome::cover::COVER_OPERATION_OPENING
      - switch.turn_on: open_relay
      - delay: !lambda 'return (uint32_t)(id(operation_duration).state * 1000);'
      - switch.turn_off: open_relay
      - delay: !lambda 'return (uint32_t)(id(open_duration).state * 1000);'
      - script.execute:
          id: set_position
          value: esphome::cover::COVER_OPEN
      - script.execute:
          id: set_current_operation
          value: esphome::cover::COVER_OPERATION_IDLE
      - light.turn_off: relay_led

  - id: close_window_script
    then:
      - light.turn_on: relay_led    
      - script.execute:
          id: set_current_operation
          value: esphome::cover::COVER_OPERATION_CLOSING
      - switch.turn_on: close_relay
      - delay: !lambda 'return (uint32_t)(id(operation_duration).state * 1000);'
      - switch.turn_off: close_relay
      - delay: !lambda 'return (uint32_t)(id(open_duration).state * 1000);'
      - script.execute:
          id: set_position
          value: esphome::cover::COVER_CLOSED
      - script.execute:
          id: set_current_operation
          value: esphome::cover::COVER_OPERATION_IDLE
      - light.turn_off: relay_led


cover:
  - platform: template
    device_class: window
    name: "Window Cover"
    id: window_cover
    internal: false
    
    has_position: true
    assumed_state: false
    optimistic: false
    
    open_action:
      - logger.log: "Opening Window"
      - script.execute: open_window_script


    close_action:
      - logger.log: "Closing Window"
      - script.execute: close_window_script


# time:
#   - platform: sntp
#     id: esptime

interval:
  - interval: 60s
    then:
      - script.execute: check_window_sensor
