# Place at /etc/logrotate.d/homebridge on the homebridge host.
# Rotates /var/lib/homebridge/homebridge.log daily, keeps 14 days
# (compressed after the first day), survives in-place truncates by
# using copytruncate (no Homebridge restart needed on rotation).
/var/lib/homebridge/homebridge.log {
    daily
    rotate 14
    compress
    delaycompress
    notifempty
    copytruncate
    missingok
    create 0644 homebridge homebridge
}
